name: Ulysse Organization Electron CD

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Application version"
        required: true
        default: "1.0.0"
      bundle:
        description: "Application bundle"
        required: true
        default: "com.ulysse.app"

jobs:
  build_and_release:
    runs-on: windows-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v1

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v4
        with:
          node-version: 20.13.1
          cache: 'npm'

      - name: Bootstrap Electron app
        run: npm install

      - name: Build Electron app
        run: npm run build:win
        env:
          ELECTRON_APP_NAME: ${{ github.event.repository.name }}
          ELECTRON_BUILD_VERSION: ${{ github.event.inputs.version }}
          ELECTRON_APP_BUNDLE: ${{ github.event.inputs.bundle }}

      - name: Display structure of directory
        run: ls -l releases/${{ github.event.inputs.version }}

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
            tag_name: v${{ github.event.inputs.version }}
            name: Release v${{ github.event.inputs.version }}
            draft: false
            prerelease: false
            files: |
              ./releases/${{ github.event.inputs.version }}/${{ github.event.repository.name }}-win-${{ github.event.inputs.version }}-Setup.exe
              ./releases/${{ github.event.inputs.version }}/${{ github.event.repository.name }}-win-${{ github.event.inputs.version }}-Setup.zip

  remove-old-artifacts:
    name: Clear Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build_and_release

    steps:
    - name: Remove old artifacts
      uses: c-hive/gha-remove-artifacts@v1
      with:
        age: '0 days'
